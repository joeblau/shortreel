name: ShortReel
options:
  bundleIdPrefix: com.joeblau
  deploymentTarget:
    macOS: "15.0"
    iOS: "17.0"

packages:
  FlyingFox:
    url: https://github.com/swhitty/FlyingFox
    from: 0.27.0
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.4
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.4

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO

targets:
  ShortReel:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: ShortReel
      - path: PhoneRunnerShared
    info:
      path: ShortReel/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: ShortReel
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSBluetoothAlwaysUsageDescription: "ShortReel uses Bluetooth to expose an AssistiveTouch HID controller for paired iPhones."
        NSCameraUsageDescription: "ShortReel reads the screen of your USB-connected iPhone so the agent can see the result of each action. macOS exposes this screen as a camera source."
        NSMicrophoneUsageDescription: "macOS exposes a USB iPhone as a combined audio and video device. ShortReel opens it to read the phone’s screen; it does not record audio."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.shortreel
        PRODUCT_NAME: ShortReel
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_OBJC_BRIDGING_HEADER: ShortReel/Services/BluetoothHID/ShortReel-Bridging-Header.h
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: IOBluetooth.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMediaIO.framework
      - sdk: Vision.framework
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: swift-transformers
        product: Tokenizers
      - package: swift-transformers
        product: Hub

  ShortReelRunner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShortReelRunner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.shortreel.runner
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "6.0"

  ShortReelRunnerUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShortReelRunnerUITests
      - path: PhoneRunnerShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.shortreel.runner.uitests
        TEST_TARGET_NAME: ShortReelRunner
        SWIFT_OBJC_BRIDGING_HEADER: ShortReelRunnerUITests/RunnerAccessibility.h
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "6.0"
    dependencies:
      - target: ShortReelRunner
      - package: FlyingFox
