name: Engage
options:
  bundleIdPrefix: com.joeblau
  deploymentTarget:
    macOS: "15.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO

targets:
  Engage:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Engage
    info:
      path: Engage/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Engage
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSPrincipalClass: NSApplication
        NSBluetoothAlwaysUsageDescription: "Engage uses Bluetooth to expose an AssistiveTouch HID controller for paired iPhones."
        NSCameraUsageDescription: "Engage reads the screen of your USB-connected iPhone so the agent can see the result of each action. macOS exposes this screen as a camera source."
        NSMicrophoneUsageDescription: "macOS exposes a USB iPhone as a combined audio and video device. Engage opens it to read the phone’s screen; it does not record audio."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.engage
        PRODUCT_NAME: Engage
        CODE_SIGNING_ALLOWED: NO
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_OBJC_BRIDGING_HEADER: Engage/Services/BluetoothHID/Engage-Bridging-Header.h
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: IOBluetooth.framework
      - sdk: AVFoundation.framework
      - sdk: CoreMediaIO.framework
      - sdk: Vision.framework
